name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "native-android/**"
      - "capacitor.config.*"
      - "vite.capacitor.config.ts"
      - "scripts/prepare-capacitor-dist.mjs"
      - "scripts/force-local-capacitor-assets.py"
      - "scripts/android-apply-icons.sh"
      - "public/offline.html"
      - "public/icon-512.png"
      - "public/logo.png"
      - "package.json"
      - "bun.lock"
      - ".env"
      - "src/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build D4EXAM Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install
          # Ensure Capgo biometric is present for Capacitor 8
          bun add @capgo/capacitor-native-biometric@^8.6.4 || true

      - name: Ensure Supabase env for SPA build
        env:
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_PUB: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SECRET_PID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            set -a
            # shellcheck disable=SC1091
            source .env || true
            set +a
          fi
          export VITE_SUPABASE_URL="${SECRET_URL:-${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${SECRET_PUB:-${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}"
          export VITE_SUPABASE_ANON_KEY="${SECRET_ANON:-${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}}"
          export VITE_SUPABASE_PROJECT_ID="${SECRET_PID:-${VITE_SUPABASE_PROJECT_ID:-${SUPABASE_PROJECT_ID:-}}}"

          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "FATAL: Supabase URL / anon key missing for APK SPA build"
            echo "Add GitHub secrets VITE_SUPABASE_URL + VITE_SUPABASE_PUBLISHABLE_KEY (or commit .env)"
            exit 1
          fi
          echo "OK: Supabase URL=${VITE_SUPABASE_URL}"
          echo "OK: project=${VITE_SUPABASE_PROJECT_ID:-unknown}"
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}"
          } >> "$GITHUB_ENV"

      - name: Build local SPA into dist/ for Capacitor
        run: |
          set -euo pipefail
          # Local-first SPA: bundled in APK (no remote Vercel shell).
          if ! node scripts/prepare-capacitor-dist.mjs; then
            echo "WARN: local SPA build failed — minimal offline shell"
            mkdir -p dist
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>D4EXAM</title></head><body style="background:#0b1b3a;color:#fff;font-family:system-ui;text-align:center;padding:2rem"><p>Offline. Connect to use D4EXAM.</p></body></html>' > dist/index.html
          fi
          mkdir -p dist
          if [ -f public/offline.html ]; then cp -f public/offline.html dist/offline.html; fi
          if [ -f public/logo.png ]; then cp -f public/logo.png dist/logo.png; fi
          test -f dist/index.html
          if ! grep -R -q "rqjchjytqcqjmljahcdr\|supabase.co" dist/assets/*.js 2>/dev/null; then
            echo "FATAL: Supabase URL not found in built SPA — login would always fail"
            ls -la dist/assets || true
            exit 1
          fi
          echo "OK: Supabase host present in SPA bundle"
          ls -la dist | head -30

      - name: Verify Capacitor uses local bundled assets (no remote website shell)
        run: |
          set -euo pipefail
          CFG="capacitor.config.ts"
          if grep -E 'url:[[:space:]]*"https?://' "$CFG"; then
            echo "FATAL: capacitor.config.ts must NOT use production server.url"
            head -50 "$CFG" || true
            exit 1
          fi
          if ! grep -q 'webDir: "dist"' "$CFG"; then
            echo "FATAL: webDir must be dist"
            exit 1
          fi
          if ! grep -q 'hostname: "localhost"' "$CFG"; then
            echo "FATAL: server.hostname must be localhost"
            exit 1
          fi
          echo "OK: local bundled APK (webDir=dist, hostname=localhost, no server.url)"

      - name: Ensure complete Android platform
        run: |
          set -euo pipefail
          rm -rf android
          bunx cap add android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Overlay native plugins + themes + D4EXAM icon
        run: |
          set -euo pipefail
          test -d native-android
          mkdir -p android/app/src/main/java/com/d4exam/app
          cp -a native-android/app/src/main/java/com/d4exam/app/. android/app/src/main/java/com/d4exam/app/

          DRAW="android/app/src/main/res/drawable"
          VALS="android/app/src/main/res/values"
          mkdir -p "$DRAW" "$VALS"

          if [ -d native-android/app/src/main/res/drawable ]; then
            cp -a native-android/app/src/main/res/drawable/. "$DRAW/" || true
          fi
          if [ -f "$DRAW/splash.xml" ]; then
            rm -f "$DRAW"/splash.png "$DRAW"/splash.jpg "$DRAW"/splash.webp "$DRAW"/splash.gif
          fi
          for xml in "$DRAW"/*.xml; do
            [ -f "$xml" ] || continue
            base="$(basename "$xml" .xml)"
            # Never delete branded splash logo PNG
            if [ "$base" = "d4exam_splash_logo" ]; then
              continue
            fi
            for ext in png jpg jpeg webp gif; do
              rm -f "$DRAW/${base}.${ext}"
            done
          done

          cp -f native-android/app/src/main/res/values/colors.xml "$VALS/" 2>/dev/null || true
          cp -f native-android/app/src/main/res/values/styles.xml "$VALS/" 2>/dev/null || true

          chmod +x scripts/android-apply-icons.sh || true
          bash scripts/android-apply-icons.sh || echo "WARN: icon script failed (non-fatal)"
          python3 scripts/generate-android-splash.py || echo "WARN: splash script failed (non-fatal)"
          test -f android/app/src/main/res/drawable/d4exam_splash_logo.png || echo "WARN: splash logo missing"

          MAN="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ScreenCaptureService' "$MAN"; then
            sed -i 's|</application>|        <service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>|' "$MAN"
          fi
          for perm in \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.MODIFY_AUDIO_SETTINGS \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.USE_BIOMETRIC \
            android.permission.USE_FINGERPRINT \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION; do
            if ! grep -q "$perm" "$MAN"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MAN"
            fi
          done

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MAN"; then
            sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|' "$MAN" || true
          fi

          test -f android/app/src/main/java/com/d4exam/app/ExamImmersivePlugin.java
          test -f android/app/src/main/java/com/d4exam/app/ScreenSharePlugin.java
          test -f android/app/src/main/java/com/d4exam/app/D4NativeAuthPlugin.java
          test -f android/app/src/main/java/com/d4exam/app/MainActivity.java
          if grep -E '^[[:space:]]*import[[:space:]]+androidx\.core\.splashscreen' \
              android/app/src/main/java/com/d4exam/app/MainActivity.java; then
            echo "ERROR: MainActivity still imports AndroidX splash API"
            exit 1
          fi
          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'ScreenSharePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'D4NativeAuthPlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          grep -q 'android.permission.VIBRATE' "$MAN"
          grep -q 'android.permission.USE_BIOMETRIC' "$MAN"
          echo "OK: native plugins + themes + icon + biometric perms"

      - name: Pin compileSdk 36 (Capacitor 8 requirement)
        run: |
          set -euo pipefail
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion *= *[0-9]*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion *= *[0-9]*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion *= *[0-9]*/minSdkVersion = 24/' android/variables.gradle
            cat android/variables.gradle
          fi

      - name: Add androidx.biometric for D4NativeAuth
        run: |
          set -euo pipefail
          BG="android/app/build.gradle"
          if ! grep -q 'androidx.biometric' "$BG"; then
            sed -i '/implementation "androidx.appcompat:appcompat/a\    implementation "androidx.biometric:biometric:1.1.0"' "$BG"
          fi
          grep -q 'androidx.biometric' "$BG"
          # Ensure Transparent theme for Capgo AuthActivity
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ] && ! grep -q 'AppTheme.Transparent' "$STYLES"; then
            sed -i 's|</resources>|    <style name="AppTheme.Transparent" parent="Theme.AppCompat.NoActionBar">\n        <item name="android:windowIsTranslucent">true</item>\n        <item name="android:windowBackground">@android:color/transparent</item>\n        <item name="android:windowNoTitle">true</item>\n    </style>\n</resources>|' "$STYLES"
          fi
          echo "OK: androidx.biometric + transparent theme"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Capacitor sync Android
        run: |
          set -euo pipefail
          bunx cap sync android
          python3 scripts/ensure-capacitor-plugins.py
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode [0-9]*/versionCode 55/' android/app/build.gradle || true
            sed -i 's/versionName "[^"]*"/versionName "1.5.5-local-first"/' android/app/build.gradle || true
            echo "OK: versionName 1.5.5-local-first"
          fi
          python3 scripts/force-local-capacitor-assets.py || true
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion *= *[0-9]*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion *= *[0-9]*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion *= *[0-9]*/minSdkVersion = 24/' android/variables.gradle
          fi
          cp -a native-android/app/src/main/java/com/d4exam/app/. android/app/src/main/java/com/d4exam/app/
          VALS="android/app/src/main/res/values"
          DRAW="android/app/src/main/res/drawable"
          mkdir -p "$VALS" "$DRAW"
          cp -f native-android/app/src/main/res/values/colors.xml "$VALS/" 2>/dev/null || true
          cp -f native-android/app/src/main/res/values/styles.xml "$VALS/" 2>/dev/null || true
          if [ -f "$DRAW/splash.xml" ]; then
            rm -f "$DRAW"/splash.png "$DRAW"/splash.jpg "$DRAW"/splash.webp "$DRAW"/splash.gif
          fi
          # Re-assert biometric permissions after sync (sync may rewrite manifest)
          MAN="android/app/src/main/AndroidManifest.xml"
          for perm in android.permission.USE_BIOMETRIC android.permission.USE_FINGERPRINT android.permission.VIBRATE; do
            if ! grep -q "$perm" "$MAN"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\" />\n</manifest>|" "$MAN"
            fi
          done
          # LOCAL-FIRST: must NOT contain remote server.url
          if [ -f android/app/src/main/assets/capacitor.config.json ]; then
            if grep -E '"url"[[:space:]]*:[[:space:]]*"https?://' android/app/src/main/assets/capacitor.config.json; then
              echo "FATAL: assets capacitor.config.json must NOT contain server.url"
              cat android/app/src/main/assets/capacitor.config.json || true
              exit 1
            fi
            if ! grep -q '"hostname"[[:space:]]*:[[:space:]]*"localhost"' android/app/src/main/assets/capacitor.config.json; then
              echo "FATAL: assets config must use hostname localhost"
              cat android/app/src/main/assets/capacitor.config.json || true
              exit 1
            fi
            echo "OK: local-first APK assets — NO server.url, hostname=localhost"
          fi
          # Native biometric must be linked after sync
          if ! grep -qi 'capgo-native-biometric\|native-biometric\|NativeBiometric' android/capacitor.settings.gradle android/app/capacitor.build.gradle 2>/dev/null; then
            echo "FATAL: biometric plugin missing from gradle"
            cat android/capacitor.settings.gradle || true
            cat android/app/capacitor.build.gradle || true
            exit 1
          fi
          echo "OK: biometric plugin linked"
          chmod +x android/gradlew
          grep -q 'ExamImmersivePlugin' android/app/src/main/java/com/d4exam/app/MainActivity.java
          echo "OK: sync complete — 100% local-first (dist via localhost) + native plugins"

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
            echo "Injected android/app/google-services.json from secret"
          elif [ -f native-android/app/google-services.json ]; then
            cp native-android/app/google-services.json android/app/google-services.json
            echo "Copied google-services.json from native-android"
          else
            echo "No google-services.json available — FCM may be disabled in this build"
          fi

      - name: Ensure Firebase Messaging dependency for FCM service
        run: |
          set -euo pipefail
          GRADLE="android/app/build.gradle"
          if ! grep -q "firebase-messaging" "$GRADLE"; then
            if grep -q "implementation project(':capacitor-cordova-android-plugins')" "$GRADLE"; then
              sed -i "/implementation project(':capacitor-cordova-android-plugins')/a\    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'" "$GRADLE"
            else
              printf "\ndependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'\n}\n" >> "$GRADLE"
            fi
            echo "Injected firebase-messaging into app build.gradle"
          else
            echo "firebase-messaging already present"
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "D4FirebaseMessagingService" "$MANIFEST"; then
            sed -i 's|android:foregroundServiceType="microphone|phoneCall" />|android:foregroundServiceType="microphone|phoneCall" />\n        <service android:name=".D4FirebaseMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>|' "$MANIFEST" || true
            echo "Attempted manifest FCM service inject"
          else
            echo "FCM service already in manifest"
          fi
          test -f android/app/src/main/java/com/d4exam/app/D4FirebaseMessagingService.java
          ls -la android/app/src/main/java/com/d4exam/app/D4FirebaseMessagingService.java
          grep -n "firebase-messaging\|D4FirebaseMessagingService" "$GRADLE" "$MANIFEST" || true

      - name: Build debug APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${ANDROID_SDK_ROOT}" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk "$ANDROID_HOME"; do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                export ANDROID_SDK_ROOT="$candidate"
                break
              fi
            done
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36" || sdkmanager "platforms;android-36" "build-tools;36.0.0"
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 250 lines) ====="
            tail -n 250 /tmp/gradle-assemble.log
            exit "$STATUS"
          fi
          ls -la app/build/outputs/apk/debug/ || true

      - name: Prepare d4exam.apk for release
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-out
          SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp -f "$SRC" /tmp/apk-out/d4exam.apk
          ls -la /tmp/apk-out/d4exam.apk

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: /tmp/apk-out/d4exam.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: D4EXAM Android APK (latest)
          body: |
            Sideload install for D4EXAM (not Play Store).

            **1.5.5-local-first** — boots from bundled dist/ (NO Vercel server.url).
            Native plugins stay connected; Supabase only when online.

            Built from commit ${{ github.sha }}
          files: /tmp/apk-out/d4exam.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
