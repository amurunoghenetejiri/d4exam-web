name: Apply chat tick promote
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-chat-tick-promote.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run patch
        run: |
          mkdir -p scripts
          python3 -c "import base64,pathlib,sys; pathlib.Path('scripts/apply_chat_tick_promote.py').write_bytes(base64.b64decode(sys.stdin.read()))" << 'B64'

B64
          python3 scripts/apply_chat_tick_promote.py
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add 'src/routes/student.messages.$conversationId.tsx'
          if git diff --cached --quiet; then echo "no change"; else git commit -m "fix: promote optimistic voice/media to ticks (no stuck spinner)" && git push; fi
