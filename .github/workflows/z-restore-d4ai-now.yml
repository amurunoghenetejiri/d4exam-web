name: Z Restore D4AI Now
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          set -euo pipefail
          git show 828997d9:src/routes/student.d4ai.tsx > src/routes/student.d4ai.tsx
          wc -c src/routes/student.d4ai.tsx
          sed -i 's|const LOGO = "[^"]*"|const LOGO = "/d4ai-avatar.png"|g' src/routes/student.d4ai.tsx
          sed -i 's|const AVATAR = "[^"]*"|const AVATAR = "/d4ai-avatar.png"|g' src/routes/student.d4ai.tsx
          if ! grep -q 'v5-Ultimate' src/routes/student.d4ai.tsx; then
            sed -i 's/Online/Online · v5-Ultimate/g' src/routes/student.d4ai.tsx
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.d4ai.tsx
          git commit -m "fix(d4ai): restore complete chat UI from 828997d9" || echo nochange
          git push
