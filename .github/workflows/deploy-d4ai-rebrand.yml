name: Deploy D4AI Mockup Rebrand
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 parts and write student.d4ai.tsx
        run: |
          set -euo pipefail
          mkdir -p src/routes
          cat assets/d4ai-tsx-b64/*.b64 | base64 -d > src/routes/student.d4ai.tsx
          wc -c src/routes/student.d4ai.tsx
          head -8 src/routes/student.d4ai.tsx
          grep -n "Hello, Boss\|Link2\|Tap to speak\|D4Avatar\|v5-Ultimate\|speakText" src/routes/student.d4ai.tsx | head -20
          # ensure asset paths
          sed -i 's|const LOGO = "[^"]*"|const LOGO = "/d4ai-avatar.png"|g' src/routes/student.d4ai.tsx
          sed -i 's|const AVATAR = "[^"]*"|const AVATAR = "/d4ai-avatar.png"|g' src/routes/student.d4ai.tsx
          # syntax check
          node -e "require('fs').readFileSync('src/routes/student.d4ai.tsx','utf8'); console.log('read ok')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.d4ai.tsx
          git status
          git commit -m "feat(d4ai): full mockup rebrand UI (neon, menus, voice, long-press, typewriter)" || echo nochange
          git push
