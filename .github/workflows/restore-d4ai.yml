name: Restore D4AI route
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download good file and commit
        run: |
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-web/b41c22edaa68b615d7444e796164697fe82a0b7a/src/routes/student.d4ai.tsx" -o src/routes/student.d4ai.tsx
          wc -l src/routes/student.d4ai.tsx
          git config user.name "d4ai-restore"
          git config user.email "d4ai@d4tech.local"
          git add src/routes/student.d4ai.tsx
          git commit -m "restore(d4ai): full campus voice STT typewriter implementation" || echo no change
          git push
