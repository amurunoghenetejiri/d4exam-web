name: fix-click-bridge
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-click-bridge.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bridge fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/student.messages.tsx")
          t = p.read_text()

          # Bridge: expose selection helpers on window so ConversationList (separate component) can use them
          if "__d4ChatSelectBridge" not in t:
              bridge = '''
  // Bridge selection state into window for ConversationList (separate component scope)
  useEffect(() => {
    const w = window as unknown as {
      __d4ChatSelectBridge?: {
        ids: string[];
        toggle: (id: string) => void;
        enter: (id: string) => void;
        mode: boolean;
      };
    };
    w.__d4ChatSelectBridge = {
      ids: selectedChatIds,
      mode: selectionMode,
      toggle: (id: string) =>
        setSelectedChatIds((prev) =>
          prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id],
        ),
      enter: (id: string) =>
        setSelectedChatIds((prev) => (prev.includes(id) ? prev : [...prev, id])),
    };
    return () => {
      try { delete w.__d4ChatSelectBridge; } catch { /* */ }
    };
  }, [selectedChatIds, selectionMode]);
'''
              # insert after selection state declarations
              needle = "const persistPins = (ids: string[]) => { setPinnedIds(ids); try { localStorage.setItem(\"d4_pinned_chats\", JSON.stringify(ids)); } catch {} };"
              if needle in t:
                  t = t.replace(needle, needle + bridge, 1)
                  print("bridge effect")
              else:
                  # fallback after activeChatId block
                  t = t.replace(
                      "const selectionMode = selectedChatIds.length > 0;",
                      "const selectionMode = selectedChatIds.length > 0;" + bridge,
                      1,
                  )
                  print("bridge fallback")

          # Replace broken onClick body that references setSelectedChatIds
          # Use a helper string injected once
          helper = '''
function d4SelectBridge() {
  try {
    return (window as unknown as { __d4ChatSelectBridge?: { ids: string[]; toggle: (id: string) => void; enter: (id: string) => void; mode: boolean } }).__d4ChatSelectBridge;
  } catch {
    return undefined;
  }
}
'''
          if "function d4SelectBridge" not in t:
              # insert before ConversationList
              t = t.replace("function ConversationList(", helper + "\nfunction ConversationList(", 1)
              print("helper")

          # Replace click handlers
          old_click = "onClick={() => { if (selectedChatIds.length > 0) { setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]); return; } onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined }); }}"
          new_click = "onClick={() => { const b = d4SelectBridge(); if (b && (b.mode || b.ids.length > 0)) { b.toggle(c.id); return; } onOpen(c.id, { title: c.title === \"You\" ? \"Me\" : c.title, peerUserId: c.peerUserId || undefined }); }}"
          if old_click in t:
              t = t.replace(old_click, new_click, 1)
              print("click")
          else:
              # broader: any setSelectedChatIds in onClick near onOpen(c.id
              t2 = t.replace(
                  "setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]); return; } onOpen(c.id",
                  "d4SelectBridge()?.toggle(c.id); return; } onOpen(c.id",
              )
              t2 = t2.replace(
                  "setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id])",
                  "d4SelectBridge()?.enter(c.id)",
              )
              if t2 != t:
                  t = t2
                  print("broad replace")
              else:
                  print("WARN click pattern not found")

          t = t.replace(
              "onContextMenu={(e) => { e.preventDefault(); setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]); }}",
              "onContextMenu={(e) => { e.preventDefault(); d4SelectBridge()?.enter(c.id); }}",
              1,
          )
          t = t.replace(
              'onTouchStart={() => { const timer = window.setTimeout(() => setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]), 480); const clear = () => clearTimeout(timer); window.addEventListener("touchend", clear, { once: true }); window.addEventListener("touchmove", clear, { once: true }); }}',
              'onTouchStart={() => { const timer = window.setTimeout(() => { d4SelectBridge()?.enter(c.id); try { navigator.vibrate?.(10); } catch {} }, 450); const clear = () => window.clearTimeout(timer); window.addEventListener("touchend", clear, { once: true }); window.addEventListener("touchmove", clear, { once: true }); }}',
              1,
          )

          # Always Me
          if "chatsWithMe" not in t:
              t = t.replace(
                  "  }, [allChats, groups, search, tab]);",
                  '''  }, [allChats, groups, search, tab]);
  const chatsWithMe = useMemo(() => {
    const list = [...filteredChats];
    if (!list.some((c) => c.title === "You" || c.title === "Me" || (c as { isSelf?: boolean }).isSelf) && userId) {
      list.unshift({
        id: "__me__",
        type: "direct" as const,
        title: "You",
        subtitle: "Message yourself",
        preview: "",
        avatar_url: null,
        time: null,
        unread: 0,
        isGroup: false,
        peerUserId: userId,
        hasMessage: false,
        isSelf: true,
      } as ConversationListItem & { isSelf?: boolean });
    }
    return list;
  }, [filteredChats, userId]);
''',
                  1,
              )
              t = t.replace("items={filteredChats}", "items={chatsWithMe}", 1)
              print("me")

          if 'id === "__me__"' not in t:
              t = t.replace(
                  "if (!id) return;\n      // Inline chat view",
                  '''if (!id) return;
      if (id === "__me__") {
        void (async () => {
          try {
            const realId = await getOrCreateSelfChat(userId, schoolId || schoolIdHint || null);
            try { sessionStorage.setItem(`d4_chat_title_${realId}`, "Me"); } catch {}
            setActiveChatId(realId);
            try { appNavigate(`/student/messages/${realId}`); } catch {}
            try { void navigate({ to: "/student/messages/$conversationId", params: { conversationId: realId } }); } catch {}
            void qc.invalidateQueries({ queryKey: ["campus-conversations", userId] });
          } catch (e) {
            toast.error(e instanceof Error ? e.message : "Could not open Me chat");
          }
        })();
        return;
      }
      // Inline chat view''',
                  1,
              )
              t = t.replace("[navigate],", "[navigate, userId, schoolId, schoolIdHint, qc],", 1)
              print("open me")

          if '? "Me" : c.title' not in t:
              t = t.replace(
                  "{c.title}\n                  {c.isGroup ? (",
                  "{(c.title === \"You\" || (c as { isSelf?: boolean }).isSelf) ? \"Me\" : c.title}\n                  {c.isGroup ? (",
                  1,
              )

          # Highlight selected via bridge
          if "d4SelectBridge()?.ids.includes" not in t:
              t = t.replace(
                  "selectedId && selectedId === c.id",
                  "((d4SelectBridge()?.ids.includes(c.id)) || (selectedId && selectedId === c.id))",
                  1,
              )

          p.write_text(t)
          assert "d4SelectBridge" in t
          assert "__me__" in t
          print("OK", len(t))
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/student.messages.tsx
          git status
          git diff --cached --quiet || git commit -m "fix: chat list open + long-press select via bridge; always show Me"
          git push
