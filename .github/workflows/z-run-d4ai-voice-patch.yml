name: Run D4AI Voice Patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run patch
        run: |
          set -euo pipefail
          if [ -f assets/d4ai-patch/00.b64 ] && [ -f assets/d4ai-patch/01.b64 ]; then
            cat assets/d4ai-patch/00.b64 assets/d4ai-patch/01.b64 | tr -d '\n ' | base64 -d | gunzip > /tmp/patch_d4ai_voice.py
          else
            echo missing parts; ls -la assets/d4ai-patch || true; exit 1
          fi
          python3 /tmp/patch_d4ai_voice.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.d4ai.tsx
          git commit -m "fix(d4ai): attach sheet, live call, TTS voices, STT dedupe, no bottom nav" || echo nochange
          git push
