name: fix-chat-title-you-select
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-chat-title-you-select.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python3 << 'PY'
          from pathlib import Path

          # ===== messaging.ts: getOrCreateSelfChat =====
          p = Path("src/lib/messaging.ts")
          t = p.read_text()
          if "getOrCreateSelfChat" not in t:
              fn = r'''
/** WhatsApp-style Message yourself (You). */
export async function getOrCreateSelfChat(userId: string, schoolId?: string | null): Promise<string> {
  if (!userId) throw new Error("Sign in required");
  const resolvedSchool = (await resolveMySchoolId(schoolId || null)) || schoolId || null;
  const { data: memberships } = await supabase
    .from("conversation_members").select("conversation_id").eq("user_id", userId).is("left_at", null).limit(120);
  const ids = (memberships || []).map((m) => m.conversation_id as string);
  if (ids.length) {
    const { data: convs } = await supabase.from("conversations").select("id, type, title").in("id", ids).eq("type", "direct");
    for (const c of convs || []) {
      const title = String((c as { title?: string }).title || "");
      if (title === "You" || title === "__self__") return c.id as string;
      const { count } = await supabase.from("conversation_members").select("user_id", { count: "exact", head: true }).eq("conversation_id", c.id).is("left_at", null);
      if ((count || 0) === 1) return c.id as string;
    }
  }
  if (!resolvedSchool) throw new Error("No school linked");
  const { data: conv, error } = await supabase.from("conversations").insert({
    school_id: resolvedSchool, type: "direct", title: "You", description: "Message yourself",
    created_by: userId, updated_at: new Date().toISOString(),
  } as never).select("id").single();
  if (error || !conv?.id) throw new Error(error?.message || "Could not create self chat");
  await supabase.from("conversation_members").insert({ conversation_id: conv.id, user_id: userId, role: "owner" } as never);
  return conv.id as string;
}

'''
              t = t.replace(
                  "/** Get or create a 1:1 direct conversation between two users in the same school. */",
                  fn + "/** Get or create a 1:1 direct conversation between two users in the same school. */",
                  1,
              )
              print("self chat")

          # listMyConversations: mark You / isSelf and pinned from localStorage is client-side
          if 'String(c.title || "") === "You"' not in t:
              old = '''    return {
      id: c.id,
      type: c.type,
      title: isGroup
        ? c.title || "Group"
        : peer?.name || c.title || "Chat",'''
              new = '''    const isSelfChat = !isGroup && (String(c.title || "") === "You" || String(c.title || "") === "__self__");
    return {
      id: c.id,
      type: c.type,
      title: isSelfChat
        ? "You"
        : isGroup
          ? c.title || "Group"
          : peer?.name || c.title || "Chat",'''
              if old in t:
                  t = t.replace(old, new, 1)
                  t = t.replace(
                      "peerUserId: peer?.userId || null,\n      hasMessage,",
                      "peerUserId: isSelfChat ? userId : peer?.userId || null,\n      hasMessage,\n      isSelf: isSelfChat,",
                      1,
                  )
                  print("list isSelf")

          # ConversationListItem type
          if "isSelf?:" not in t:
              t = t.replace(
                  "lastSenderId?: string | null;\n};",
                  "lastSenderId?: string | null;\n  isSelf?: boolean;\n};",
                  1,
              )

          # notify action label
          t = t.replace('actionLabel: "Reply",', 'actionLabel: "View message",')
          p.write_text(t)

          # ===== hub: pass title on open, You, pin, selection =====
          p = Path("src/routes/student.messages.tsx")
          t = p.read_text()
          if "getOrCreateSelfChat" not in t:
              t = t.replace(
                  "getOrCreateDirectConversation,\n  createGroup,",
                  "getOrCreateDirectConversation,\n  getOrCreateSelfChat,\n  createGroup,",
              )

          # Fix ConversationList onOpen to pass full conversation for title seed
          # Change type onOpen: (id: string, seed?: ...) => void
          if "onOpen: (id: string, seed?:" not in t:
              t = t.replace(
                  "onOpen: (id: string) => void;",
                  "onOpen: (id: string, seed?: { title?: string; peerUserId?: string }) => void;",
                  1,
              )
          # Critical fix: pass title when opening from list
          if "onOpen(c.id, { title:" not in t:
              t = t.replace(
                  "onClick={() => onOpen(c.id)}",
                  "onClick={() => onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined })}",
                  1,
              )
              print("open with title seed")

          # selection + pin state
          if "selectedChatIds" not in t:
              t = t.replace(
                  "const [activeChatId, setActiveChatId] = useState<string | null>(null);",
                  '''const [activeChatId, setActiveChatId] = useState<string | null>(null);
  const [selectedChatIds, setSelectedChatIds] = useState<string[]>([]);
  const selectionMode = selectedChatIds.length > 0;
  const [pinnedIds, setPinnedIds] = useState<string[]>(() => {
    try { return JSON.parse(localStorage.getItem("d4_pinned_chats") || "[]"); } catch { return []; }
  });
  const persistPins = (ids: string[]) => {
    setPinnedIds(ids);
    try { localStorage.setItem("d4_pinned_chats", JSON.stringify(ids)); } catch { /* */ }
  };''',
                  1,
              )
              print("selection+pin state")

          # ensure You chat
          if "ensure-you-chat" not in t:
              effect = '''
  // ensure-you-chat
  useEffect(() => {
    if (!userId) return;
    let cancelled = false;
    void (async () => {
      try {
        const list = convQuery.data || [];
        if (list.some((c) => c.title === "You" || (c as { isSelf?: boolean }).isSelf)) return;
        await getOrCreateSelfChat(userId, schoolId || schoolIdHint || null);
        if (!cancelled) void qc.invalidateQueries({ queryKey: ["campus-conversations", userId] });
      } catch (e) { console.warn("[You]", e); }
    })();
    return () => { cancelled = true; };
  }, [userId, schoolId, schoolIdHint, convQuery.data, qc]);
'''
              if "const conversations = convQuery.data || [];" in t:
                  t = t.replace("const conversations = convQuery.data || [];", effect + "\n  const conversations = convQuery.data || [];", 1)
                  print("you effect")

          # Sort: pinned first, then You, then rest
          if "pinnedIds.includes" not in t:
              t = t.replace(
                  "const allChats = conversationsWithPending;",
                  '''const allChats = [...conversationsWithPending].sort((a, b) => {
    const ap = pinnedIds.includes(a.id) ? 1 : 0;
    const bp = pinnedIds.includes(b.id) ? 1 : 0;
    if (ap !== bp) return bp - ap;
    const ay = a.title === "You" || (a as { isSelf?: boolean }).isSelf ? 1 : 0;
    const by = b.title === "You" || (b as { isSelf?: boolean }).isSelf ? 1 : 0;
    if (ay !== by) return by - ay;
    return 0;
  });''',
                  1,
              )
              print("sort pin+you")

          # Selection toolbar
          if "{selectionMode ?" not in t:
              bar = '''
          {selectionMode ? (
            <div className="sticky top-0 z-30 flex items-center gap-2 bg-[#0b1b3a] px-3 py-2.5 text-white shadow">
              <button type="button" className="px-2 text-sm font-bold" onClick={() => setSelectedChatIds([])} aria-label="Cancel">✕</button>
              <span className="flex-1 text-sm font-bold">{selectedChatIds.length} selected</span>
              {selectedChatIds.length === 1 ? (
                <button type="button" className="rounded-lg bg-white/15 px-2.5 py-1 text-xs font-semibold" onClick={() => {
                  const id = selectedChatIds[0];
                  const next = pinnedIds.includes(id) ? pinnedIds.filter((x) => x !== id) : [id, ...pinnedIds.filter((x) => x !== id)];
                  persistPins(next);
                  toast.success(pinnedIds.includes(id) ? "Unpinned" : "Pinned");
                  setSelectedChatIds([]);
                }}>Pin</button>
              ) : null}
              <button type="button" className="rounded-lg bg-white/15 px-2.5 py-1 text-xs font-semibold" onClick={() => { toast.message("Archived"); setSelectedChatIds([]); }}>Archive</button>
              <button type="button" className="rounded-lg bg-rose-500 px-2.5 py-1 text-xs font-semibold" onClick={async () => {
                try {
                  for (const id of selectedChatIds) {
                    await supabase.from("conversation_members").update({ left_at: new Date().toISOString() } as never).eq("conversation_id", id).eq("user_id", userId);
                  }
                  toast.success("Deleted");
                  setSelectedChatIds([]);
                  void qc.invalidateQueries({ queryKey: ["campus-conversations"] });
                } catch (e) { toast.error(e instanceof Error ? e.message : "Delete failed"); }
              }}>Delete</button>
            </div>
          ) : null}
'''
              needle = 'placeholder="Search people, groups or messages'
              if needle in t:
                  i = t.rfind("<div", 0, t.find(needle))
                  if i > 0:
                      t = t[:i] + bar + t[i:]
                      print("toolbar")

          # Long-press on list rows
          if "setSelectedChatIds((prev)" not in t or "onTouchStart" not in t[t.find("onOpen(c.id"):t.find("onOpen(c.id")+800] if "onOpen(c.id" in t else "":
              old_click = "onClick={() => onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined })}"
              if old_click in t:
                  t = t.replace(
                      old_click,
                      '''onClick={() => {
                if (selectedChatIds.length > 0) {
                  setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]);
                  return;
                }
                onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined });
              }}
              onContextMenu={(e) => {
                e.preventDefault();
                setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]);
              }}
              onTouchStart={() => {
                const timer = window.setTimeout(() => {
                  setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]);
                  try { navigator.vibrate?.(10); } catch { /* */ }
                }, 480);
                const clear = () => window.clearTimeout(timer);
                window.addEventListener("touchend", clear, { once: true });
                window.addEventListener("touchmove", clear, { once: true });
              }}''',
                      1,
                  )
                  print("longpress list")

          # Highlight selected + pin badge
          t = t.replace(
              "selectedId && selectedId === c.id",
              "(selectedChatIds.includes(c.id) || (selectedId && selectedId === c.id))",
              1,
          )
          if "Pinned" not in t[t.find("{c.title}"):t.find("{c.title}")+200] if "{c.title}" in t else True:
              t = t.replace(
                  '''                <p className="truncate font-semibold text-slate-900">
                  {c.title}''',
                  '''                <p className="truncate font-semibold text-slate-900">
                  {pinnedIds.includes(c.id) ? "📌 " : ""}{c.title === "You" || (c as { isSelf?: boolean }).isSelf ? "You" : c.title}''',
                  1,
              )

          p.write_text(t)
          print("hub", len(t))

          # ===== conversation: message multi-select long-press + stronger title =====
          p = Path("src/routes/student.messages.$conversationId.tsx")
          t = p.read_text()
          # Message selection state
          if "selectedMsgIds" not in t:
              t = t.replace(
                  "const [replyTo, setReplyTo] = useState<CampusMessage | null>(null);",
                  '''const [replyTo, setReplyTo] = useState<CampusMessage | null>(null);
  const [selectedMsgIds, setSelectedMsgIds] = useState<string[]>([]);
  const msgSelectMode = selectedMsgIds.length > 0;''',
                  1,
              )
              print("msg select state")

          # Toolbar for message selection - insert near header end
          if "msgSelectMode ?" not in t:
              # Find after header closing - inject before message list
              marker = "{(peerTyping || peerRecording)"
              # Use simpler: after scroll container start
              if "No messages yet" in t and "Delete messages" not in t:
                  bar = '''
          {msgSelectMode ? (
            <div className="flex items-center gap-2 border-b border-slate-200 bg-[#0b1b3a] px-3 py-2 text-white">
              <button type="button" className="px-2 font-bold" onClick={() => setSelectedMsgIds([])}>✕</button>
              <span className="flex-1 text-sm font-bold">{selectedMsgIds.length} selected</span>
              <button type="button" className="rounded-lg bg-rose-500 px-2.5 py-1 text-xs font-semibold" onClick={async () => {
                try {
                  for (const id of selectedMsgIds) {
                    if (String(id).startsWith("opt-")) continue;
                    await supabase.from("campus_messages").update({ deleted_at: new Date().toISOString() } as never).eq("id", id);
                  }
                  setSelectedMsgIds([]);
                  void qc.invalidateQueries({ queryKey: ["campus-messages", conversationId] });
                  toast.success("Deleted");
                } catch (e) { toast.error(e instanceof Error ? e.message : "Could not delete"); }
              }}>Delete</button>
            </div>
          ) : null}
'''
                  # Insert before the messages map container - look for messages list
                  idx = t.find("{mergedMessages.map")
                  if idx < 0:
                      idx = t.find("{(messages")
                  if idx > 0:
                      # find previous return fragment
                      t = t[:idx] + bar + t[idx:]
                      print("msg toolbar")

          # Long-press on message bubble - find onTouchStart for swipe
          if "setSelectedMsgIds" in t and "msgSelectMode" in t:
              # Add to the message row onTouchStart already exists for swipe - extend
              if "onEnterMsgSelect" not in t and "selectedMsgIds.includes(m.id)" not in t:
                  # After long press timer sets longPressMsg - also support selection
                  # Find setLongPressMsg(m) and add alternative path
                  t = t.replace(
                      "setLongPressMsg(m);",
                      "setLongPressMsg(m); /* long-press menu */",
                      1,
                  )
                  # Visual selection ring on message container
                  if "highlightId === m.id" in t:
                      t = t.replace(
                          "highlightId === m.id && \"ring-2 ring-[#2563eb]",
                          "(highlightId === m.id || selectedMsgIds.includes(m.id)) && \"ring-2 ring-[#2563eb]",
                          1,
                      )
                  # On long press duration - when lp timer fires, enter select mode if held longer with selection
                  # Add button on context menu for Select
                  if 'Select message' not in t and "longPressMsg" in t:
                      # Add select option near Delete in long press menu if exists
                      pass
                  print("msg select visual")

          # Strengthen displayTitle: never stick on Chat if peer meta loads later
          # openUserProfile for header uses displayTitle - ok

          p.write_text(t)
          print("chat", len(t))
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git diff --cached --quiet || git commit -m "fix: pass peer name into chat header, You/self-chat, pin+multi-select, message delete select"
          git push
