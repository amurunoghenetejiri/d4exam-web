name: Apply D4AI Rebrand
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore base then apply rebrand assets
        run: |
          set -e
          # restore last known-good d4ai route if placeholder
          if [ "$(wc -c < src/routes/student.d4ai.tsx)" -lt 1000 ]; then
            curl -fsSL -o src/routes/student.d4ai.tsx \
              "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-web/b41c22edaa68b615d7444e796164697fe82a0b7a/src/routes/student.d4ai.tsx"
          fi
          # logo/avatar will be committed in follow-up if missing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: ensure D4AI route not placeholder"
          git push
