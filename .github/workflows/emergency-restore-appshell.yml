name: emergency-restore-appshell
on:
  push:
    paths:
      - ".github/workflows/emergency-restore-appshell.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore AppShell from known good commit
        run: |
          curl -sL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-web/afdba00709481b1e0b2a8c7aa093a84690b0a906/src/components/layout/AppShell.tsx" -o src/components/layout/AppShell.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/layout/AppShell.tsx")
          t = p.read_text()
          needle = 'pathname.includes("/student/messages");'
          insert = 'pathname.includes("/student/messages") ||\n    pathname.includes("/student/d4ai");'
          if "/student/d4ai" not in t and needle in t:
              t = t.replace(needle, insert, 1)
              p.write_text(t)
              print("patched immersive")
          print("size", p.stat().st_size)
          assert p.stat().st_size > 10000, "AppShell too small"
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/components/layout/AppShell.tsx
          git diff --staged --quiet || git commit -m "fix(critical): restore AppShell from afdba007 + d4ai immersive"
          git push
