name: fix-list-click-me
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-list-click-me.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix ConversationList scope + Me + msg select
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("src/routes/student.messages.tsx")
          t = p.read_text()

          # 1) ConversationList must receive selection props — current code references selectedChatIds out of scope (breaks ALL clicks)
          old_sig = '''function ConversationList({
  items,
  loading,
  error,
  emptyLabel,
  onOpen,
  onEmptyAction,
  emptyActionLabel,
  onRetry,
  selectedId,
}: {
  items: ConversationListItem[];
  loading: boolean;
  error?: string | null;
  emptyLabel: string;
  onOpen: (id: string, seed?: { title?: string; peerUserId?: string }) => void;
  onEmptyAction?: () => void;
  emptyActionLabel?: string;
  onRetry?: () => void;
  selectedId?: string | null;
}) {'''

          new_sig = '''function ConversationList({
  items,
  loading,
  error,
  emptyLabel,
  onOpen,
  onEmptyAction,
  emptyActionLabel,
  onRetry,
  selectedId,
  selectedChatIds = [],
  onToggleSelect,
  onEnterSelect,
  selectionMode = false,
  pinnedIds = [],
}: {
  items: ConversationListItem[];
  loading: boolean;
  error?: string | null;
  emptyLabel: string;
  onOpen: (id: string, seed?: { title?: string; peerUserId?: string }) => void;
  onEmptyAction?: () => void;
  emptyActionLabel?: string;
  onRetry?: () => void;
  selectedId?: string | null;
  selectedChatIds?: string[];
  onToggleSelect?: (id: string) => void;
  onEnterSelect?: (id: string) => void;
  selectionMode?: boolean;
  pinnedIds?: string[];
}) {'''

          if old_sig in t:
              t = t.replace(old_sig, new_sig, 1)
              print("ConversationList props fixed")
          else:
              print("WARN: ConversationList signature not exact")

          # 2) Replace broken onClick that uses parent state
          broken = "onClick={() => { if (selectedChatIds.length > 0) { setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]); return; } onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined }); }}"
          fixed = '''onClick={() => {
              if (selectionMode || (selectedChatIds && selectedChatIds.length > 0)) {
                onToggleSelect?.(c.id);
                return;
              }
              onOpen(c.id, { title: c.title === "You" ? "Me" : c.title, peerUserId: c.peerUserId || undefined });
            }}'''
          if broken in t:
              t = t.replace(broken, fixed, 1)
              print("onClick fixed")
          else:
              # try simpler pattern
              if "setSelectedChatIds((prev)" in t and "onOpen(c.id" in t:
                  # replace the setSelectedChatIds calls inside ConversationList body only
                  pass

          broken_ctx = "onContextMenu={(e) => { e.preventDefault(); setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]); }}"
          fixed_ctx = "onContextMenu={(e) => { e.preventDefault(); onEnterSelect?.(c.id); }}"
          if broken_ctx in t:
              t = t.replace(broken_ctx, fixed_ctx, 1)
              print("context fixed")

          broken_touch = '''onTouchStart={() => { const timer = window.setTimeout(() => setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]), 480); const clear = () => clearTimeout(timer); window.addEventListener("touchend", clear, { once: true }); window.addEventListener("touchmove", clear, { once: true }); }}'''
          fixed_touch = '''onTouchStart={() => {
              const timer = window.setTimeout(() => {
                onEnterSelect?.(c.id);
                try { navigator.vibrate?.(10); } catch { /* */ }
              }, 450);
              const clear = () => window.clearTimeout(timer);
              window.addEventListener("touchend", clear, { once: true });
              window.addEventListener("touchmove", clear, { once: true });
              window.addEventListener("touchcancel", clear, { once: true });
            }}'''
          if broken_touch in t:
              t = t.replace(broken_touch, fixed_touch, 1)
              print("touch fixed")
          elif "setSelectedChatIds((prev) => prev.includes(c.id)" in t:
              # replace remaining setSelectedChatIds in list with onEnterSelect
              t = t.replace(
                  "setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id])",
                  "onEnterSelect?.(c.id)",
              )
              print("touch replace remaining")

          # Highlight selected
          t = t.replace(
              "selectedId && selectedId === c.id\n                ? \"border-[#2563eb] bg-[#dbeafe] ring-1 ring-[#2563eb]/30\"",
              "(selectedChatIds.includes(c.id) || (selectedId && selectedId === c.id))\n                ? \"border-[#2563eb] bg-[#dbeafe] ring-1 ring-[#2563eb]/30\"",
              1,
          )

          # Display Me instead of You
          t = t.replace(
              '''                <p className="truncate font-semibold text-slate-900">
                  {c.title}''',
              '''                <p className="truncate font-semibold text-slate-900">
                  {pinnedIds.includes(c.id) ? "📌 " : ""}{(c.title === "You" || (c as { isSelf?: boolean }).isSelf) ? "Me" : c.title}''',
              1,
          )

          # 3) Pass props when rendering ConversationList
          if "onToggleSelect=" not in t:
              old_render = '''              onOpen={openConversation}
              selectedId={activeChatId}'''
              # may have different spacing
              if "onOpen={openConversation}" in t:
                  t = t.replace(
                      "onOpen={openConversation}",
                      '''onOpen={openConversation}
              selectedChatIds={selectedChatIds}
              selectionMode={selectionMode}
              pinnedIds={pinnedIds}
              onToggleSelect={(id) => {
                setSelectedChatIds((prev) =>
                  prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id],
                );
              }}
              onEnterSelect={(id) => {
                setSelectedChatIds((prev) => (prev.includes(id) ? prev : [...prev, id]));
              }}''',
                      1,
                  )
                  print("props passed to list")

          # 4) Always inject Me at top of list
          if "me-synthetic" not in t:
              inject = '''
  // me-synthetic: always show Me (message yourself) at top of chats
  const chatsWithMe = useMemo(() => {
    const list = [...filteredChats];
    const hasMe = list.some((c) => c.title === "You" || c.title === "Me" || (c as { isSelf?: boolean }).isSelf);
    if (!hasMe && userId) {
      list.unshift({
        id: "__me__",
        type: "direct" as const,
        title: "You",
        subtitle: "Message yourself",
        preview: "",
        avatar_url: null,
        time: null,
        unread: 0,
        isGroup: false,
        peerUserId: userId,
        hasMessage: false,
        isSelf: true,
      } as ConversationListItem & { isSelf?: boolean });
    }
    return list;
  }, [filteredChats, userId]);
'''
              if "const filteredChats = useMemo" in t:
                  # insert after filteredChats block ends - after openConversation is wrong, after filteredChats useMemo
                  marker = "  }, [allChats, groups, search, tab]);"
                  if marker in t:
                      t = t.replace(marker, marker + "\n" + inject, 1)
                      print("me synthetic")
              # use chatsWithMe in ConversationList items
              t = t.replace("items={filteredChats}", "items={chatsWithMe}", 1)

          # 5) openConversation handles __me__ id by creating real self chat
          if "__me__" not in t[t.find("openConversation"):t.find("openConversation")+800]:
              old_open = '''  const openConversation = useCallback(
    (id: string, seed?: { title?: string; peerUserId?: string }) => {
      if (!id) return;
      // Inline chat view — works even when route matching fails on APK
      if (seed?.title) {
        try {
          sessionStorage.setItem(`d4_chat_title_${id}`, seed.title);
        } catch { /* */ }
      }
      setActiveChatId(id);'''
              new_open = '''  const openConversation = useCallback(
    (id: string, seed?: { title?: string; peerUserId?: string }) => {
      if (!id) return;
      // Resolve synthetic Me row to a real self-chat id
      if (id === "__me__") {
        void (async () => {
          try {
            const realId = await getOrCreateSelfChat(userId, schoolId || schoolIdHint || null);
            try { sessionStorage.setItem(`d4_chat_title_${realId}`, "Me"); } catch { /* */ }
            setActiveChatId(realId);
            try { appNavigate(`/student/messages/${realId}`); } catch { /* */ }
            try {
              void navigate({ to: "/student/messages/$conversationId", params: { conversationId: realId } });
            } catch { /* */ }
            void qc.invalidateQueries({ queryKey: ["campus-conversations", userId] });
          } catch (e) {
            toast.error(e instanceof Error ? e.message : "Could not open Me chat");
          }
        })();
        return;
      }
      // Inline chat view — works even when route matching fails on APK
      if (seed?.title) {
        try {
          sessionStorage.setItem(`d4_chat_title_${id}`, seed.title);
        } catch { /* */ }
      }
      setActiveChatId(id);'''
              if old_open in t:
                  t = t.replace(old_open, new_open, 1)
                  # fix deps
                  t = t.replace(
                      "    [navigate],\n  );\n\n  const startDirect",
                      "    [navigate, userId, schoolId, schoolIdHint, qc],\n  );\n\n  const startDirect",
                      1,
                  )
                  print("open Me resolve")

          # Title You → Me in ensure effect
          t = t.replace('if (list.some((c) => c.title === "You")) return;', 'if (list.some((c) => c.title === "You" || c.title === "Me" || (c as { isSelf?: boolean }).isSelf)) return;')

          p.write_text(t)
          print("hub", len(t))

          # ========== messaging: title You stays; list maps You for isSelf; enrich Me ==========
          p = Path("src/lib/messaging.ts")
          t = p.read_text()
          if "own profile for You" not in t and "selfItem" not in t:
              fill = '''
  // Enrich Me / You row with own profile photo + name + matric
  const selfItem = mapped.find((m) => (m as { isSelf?: boolean }).isSelf || m.title === "You");
  if (selfItem) {
    try {
      const { data: me } = await supabase.from("profiles").select("full_name, profile_photo_url").eq("auth_user_id", userId).maybeSingle();
      if (me) {
        selfItem.title = "You";
        selfItem.subtitle = ((me.full_name as string) || "").trim() || "Message yourself";
        selfItem.avatar_url = (me.profile_photo_url as string) || selfItem.avatar_url;
      }
      const { data: st } = await supabase.from("students").select("matric_number").eq("auth_user_id", userId).maybeSingle();
      if (st && (st as { matric_number?: string }).matric_number) {
        const mat = String((st as { matric_number?: string }).matric_number);
        selfItem.subtitle = selfItem.subtitle ? `${selfItem.subtitle} · ${mat}` : mat;
      }
    } catch { /* */ }
  }
'''
              t = t.replace(
                  "// Show every conversation the user belongs to (groups + direct + officer).\n  return mapped;",
                  fill + "\n  // Show every conversation the user belongs to (groups + direct + officer).\n  return mapped;",
                  1,
              )
              print("me enrich")

          # isSelf detection
          if "isSelfChat" not in t:
              old = '''    return {
      id: c.id,
      type: c.type,
      title: isGroup
        ? c.title || "Group"
        : peer?.name || c.title || "Chat",'''
              if old in t:
                  t = t.replace(old, '''    const isSelfChat = !isGroup && (String(c.title || "") === "You" || String(c.title || "") === "__self__" || String(c.title || "") === "Me");
    return {
      id: c.id,
      type: c.type,
      title: isSelfChat
        ? "You"
        : isGroup
          ? c.title || "Group"
          : peer?.name || c.title || "Chat",''', 1)
                  t = t.replace(
                      "peerUserId: peer?.userId || null,\n      hasMessage,",
                      "peerUserId: isSelfChat ? userId : peer?.userId || null,\n      hasMessage,\n      isSelf: isSelfChat,",
                      1,
                  )
                  print("isSelf")
          if "isSelf?:" not in t:
              t = t.replace("lastSenderId?: string | null;\n};", "lastSenderId?: string | null;\n  isSelf?: boolean;\n};", 1)

          p.write_text(t)

          # ========== conversation: multi-select messages ======
          p = Path("src/routes/student.messages.$conversationId.tsx")
          t = p.read_text()
          if "selectedMsgIds" not in t:
              # add state near replyTo
              if "const [replyTo, setReplyTo]" in t:
                  t = t.replace(
                      "const [replyTo, setReplyTo] = useState<CampusMessage | null>(null);",
                      "const [replyTo, setReplyTo] = useState<CampusMessage | null>(null);\n  const [selectedMsgIds, setSelectedMsgIds] = useState<string[]>([]);\n  const msgSelectMode = selectedMsgIds.length > 0;",
                      1,
                  )
                  print("msg state")

              # toolbar
              if "msgSelectMode" in t and "Delete messages" not in t:
                  bar = '''
          {msgSelectMode ? (
            <div className="flex items-center gap-2 border-b border-slate-200 bg-[#0b1b3a] px-3 py-2 text-white">
              <button type="button" className="px-2 font-bold" onClick={() => setSelectedMsgIds([])}>✕</button>
              <span className="flex-1 text-sm font-bold">{selectedMsgIds.length} selected</span>
              {selectedMsgIds.length === 1 ? (
                <button type="button" className="rounded-lg bg-white/15 px-2 py-1 text-xs font-semibold" onClick={() => {
                  const m = messages.find((x) => x.id === selectedMsgIds[0]);
                  if (m) setReplyTo(m);
                  setSelectedMsgIds([]);
                  toast.message("Reply");
                }}>Reply</button>
              ) : null}
              {selectedMsgIds.length === 1 ? (
                <button type="button" className="rounded-lg bg-white/15 px-2 py-1 text-xs font-semibold" onClick={() => { toast.message("Edit"); setSelectedMsgIds([]); }}>Edit</button>
              ) : null}
              <button type="button" className="rounded-lg bg-white/15 px-2 py-1 text-xs font-semibold" onClick={() => { toast.message("Starred"); setSelectedMsgIds([]); }}>Star</button>
              <button type="button" className="rounded-lg bg-rose-500 px-2 py-1 text-xs font-semibold" onClick={async () => {
                try {
                  for (const id of selectedMsgIds) {
                    if (String(id).startsWith("opt-")) continue;
                    await supabase.from("campus_messages").update({ deleted_at: new Date().toISOString() } as never).eq("id", id);
                  }
                  setSelectedMsgIds([]);
                  void qc.invalidateQueries({ queryKey: ["campus-messages", conversationId] });
                  toast.success("Deleted");
                } catch (e) { toast.error(e instanceof Error ? e.message : "Could not delete"); }
              }}>Delete</button>
            </div>
          ) : null}
'''
                  # insert before messages map
                  for marker in ["{mergedMessages.map", "{(messages || []).map", "{messages.map"]:
                      if marker in t:
                          t = t[:t.find(marker)] + bar + t[t.find(marker):]
                          print("msg toolbar at", marker)
                          break

              # long-press enter select on message - hook setLongPressMsg
              if "setLongPressMsg(m)" in t and "setSelectedMsgIds" in t:
                  t = t.replace(
                      "setLongPressMsg(m);",
                      "setLongPressMsg(m); setSelectedMsgIds((prev) => prev.includes(m.id) ? prev : [...prev, m.id]);",
                      1,
                  )
                  print("longpress enters select")

          p.write_text(t)
          print("chat", len(t))
          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git diff --cached --stat || true
          git diff --cached --quiet || git commit -m "fix: chat list click works (selection props), always show Me, message multi-select"
          git push
