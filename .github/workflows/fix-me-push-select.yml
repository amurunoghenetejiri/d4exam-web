name: fix-me-push-select
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-me-push-select.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch push + messaging + hub
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # ========== push-send: allowSelf + imageUrl + View/Mark actions ==========
          p = Path("src/lib/push-send.functions.ts")
          t = p.read_text()

          # Validator fields for chat push
          if "allowSelf:" not in t:
              t = t.replace(
                  "callerMatric: o.callerMatric != null ? String(o.callerMatric) : undefined,\n    };\n  })\n  .handler(async ({ data }) => {\n    if (!data.conversationId || !data.senderId) {",
                  "callerMatric: o.callerMatric != null ? String(o.callerMatric) : undefined,\n      imageUrl: o.imageUrl != null ? String(o.imageUrl) : (o.avatarUrl != null ? String(o.avatarUrl) : undefined),\n      allowSelf: Boolean(o.allowSelf),\n    };\n  })\n  .handler(async ({ data }) => {\n    if (!data.conversationId || !data.senderId) {",
                  1,
              )
              print("chat validator allowSelf")

          # Recipients: include sender when allowSelf or only-self membership
          old_rec = """.filter((id) => id && id !== data.senderId);
    if (!recipients.length) {
      return { sent: 0, failed: 0, skipped: true as const, reason: "no recipients" };
    }"""
          new_rec = """.filter((id) => id && id !== data.senderId);
    // Me / note-to-self: only the sender is a member — still notify so user can test push
    if ((!recipients.length && data.allowSelf) || (data.allowSelf && data.senderId && data.senderId not in recipients)) {
      if (data.senderId and data.senderId not in recipients):
        recipients.append(data.senderId)
    }
    # pure self-chat without flag: if members only include sender, notify them for Me chat
    member_ids = [(m as { user_id?: string }).user_id for m in (members or [])]
    # fix syntax - this is TS not python in the string
    if (!recipients.length) {
      const onlySelf = (members || []).every((m) => String((m as { user_id?: string }).user_id || "") === data.senderId);
      if (onlySelf || data.allowSelf) recipients.push(data.senderId);
    }
    if (!recipients.length) {
      return { sent: 0, failed: 0, skipped: true as const, reason: "no recipients" };
    }"""
          # Fix the botched python in string - rewrite cleanly
          new_rec = '''.filter((id) => id && id !== data.senderId);
    // Me chat: only sender is a member — still push so they can test notifications
    if (!recipients.length) {
      const onlySelf =
        (members || []).length > 0 &&
        (members || []).every(
          (m) => String((m as { user_id?: string }).user_id || "") === data.senderId,
        );
      if (onlySelf || data.allowSelf) {
        recipients.push(data.senderId);
      }
    }
    if (!recipients.length) {
      return { sent: 0, failed: 0, skipped: true as const, reason: "no recipients" };
    }'''
          if old_rec in t:
              t = t.replace(old_rec, new_rec, 1)
              print("allowSelf recipients")
          else:
              print("WARN recipients block not found")

          # Forward imageUrl + actionLabel in dispatchPushToUser call inside chat handler
          if 'actionLabel: "View message"' not in t:
              t = t.replace('actionLabel: "Reply",', 'actionLabel: "View message",')
          # Add imageUrl to the data object in the loop if missing
          if "imageUrl: data.imageUrl" not in t:
              t = t.replace(
                  "attachmentType: data.attachmentType || \"\",",
                  "attachmentType: data.attachmentType || \"\",\n            imageUrl: data.imageUrl || \"\",\n            avatarUrl: data.imageUrl || \"\",",
                  1,
              )
              print("forward imageUrl")

          # dispatchPushToUser validator: accept imageUrl
          if "imageUrl: o.imageUrl" not in t:
              t = t.replace(
                  "messageId: o.messageId != null ? String(o.messageId) : undefined,",
                  "messageId: o.messageId != null ? String(o.messageId) : undefined,\n      imageUrl: o.imageUrl != null ? String(o.imageUrl) : (o.avatarUrl != null ? String(o.avatarUrl) : undefined),",
                  1,
              )

          # FCM payload: use imageUrl for icon/image when present
          if "extra?.imageUrl" not in t and "(extra as { imageUrl" not in t:
              t = t.replace(
                  "const icon = `${origin}/icon-192.png`;",
                  '''const icon = `${origin}/icon-192.png`;
  const imageUrl = String(
    (extra as { imageUrl?: string; avatarUrl?: string } | null | undefined)?.imageUrl ||
      (extra as { avatarUrl?: string } | null | undefined)?.avatarUrl ||
      "",
  ).trim() || icon;''',
                  1,
              )
              t = t.replace(
                  "icon: String(icon),\n      badge: String(icon),",
                  "icon: String(imageUrl || icon),\n      badge: String(icon),\n      image: String(imageUrl || icon),",
                  1,
              )
              # notification block image
              t = re.sub(
                  r"(messagePayload\.notification = \{\s*title: fullTitle,\s*body: fullBody,?)(\s*\};)",
                  r"\1,\n      image: imageUrl || undefined,\2",
                  t,
                  count=1,
              )
              print("FCM image")

          p.write_text(t)

          # ========== messaging: avatar in notify + allowSelf for You chat ==========
          p = Path("src/lib/messaging.ts")
          t = p.read_text()

          # Load profile photo in notify
          if "profile_photo_url" not in t[t.find("notifyMessageRecipients"): t.find("notifyMessageRecipients") + 800]:
              t = t.replace(
                  '.select("full_name, first_name, last_name")\n        .eq("auth_user_id", opts.senderId)',
                  '.select("full_name, first_name, last_name, profile_photo_url")\n        .eq("auth_user_id", opts.senderId)',
                  1,
              )
              t = t.replace(
                  "let senderName = \"D4EXAM\";\n    let senderMatric = \"\";",
                  "let senderName = \"D4EXAM\";\n    let senderMatric = \"\";\n    let senderAvatar = \"\";",
                  1,
              )
              t = t.replace(
                  "senderName =\n          (p.full_name || \"\").trim() ||\n          [p.first_name, p.last_name].filter(Boolean).join(\" \").trim() ||\n          senderName;",
                  "senderName =\n          (p.full_name || \"\").trim() ||\n          [p.first_name, p.last_name].filter(Boolean).join(\" \").trim() ||\n          senderName;\n        senderAvatar = String((p as { profile_photo_url?: string }).profile_photo_url || \"\");",
                  1,
              )
              print("notify avatar")

          # Detect self-chat and pass allowSelf
          if "allowSelf:" not in t[t.find("dispatchChatMessagePush"):t.find("dispatchChatMessagePush")+600] if "dispatchChatMessagePush" in t else True:
              # Before dispatch, detect only-self membership
              insert = '''
    // Detect Me / note-to-self (only member is sender)
    let allowSelf = false;
    try {
      const { data: mems } = await supabase
        .from("conversation_members")
        .select("user_id")
        .eq("conversation_id", opts.conversationId)
        .is("left_at", null);
      const ids = (mems || []).map((m) => String((m as { user_id?: string }).user_id || "")).filter(Boolean);
      allowSelf = ids.length === 1 && ids[0] === opts.senderId;
    } catch { /* */ }
'''
              if "let allowSelf" not in t:
                  t = t.replace(
                      "const title = senderMatric ? `${senderName} · ${senderMatric}` : senderName;",
                      insert + "\n    const title = senderMatric ? `${senderName} · ${senderMatric}` : senderName;",
                      1,
                  )
              t = t.replace(
                  "callerName: senderName,\n          callerMatric: senderMatric,\n        },\n      });",
                  "callerName: senderName,\n          callerMatric: senderMatric,\n          imageUrl: senderAvatar,\n          avatarUrl: senderAvatar,\n          allowSelf,\n        },\n      });",
                  1,
              )
              t = t.replace(
                  'actionLabel: "Reply",',
                  'actionLabel: "View message",',
              )
              # fallback path include self when allowSelf
              t = t.replace(
                  ".filter((id) => id && id !== opts.senderId);\n    if (!recipients.length) return;",
                  ".filter((id) => id && id !== opts.senderId);\n    if (!recipients.length && allowSelf) recipients.push(opts.senderId);\n    if (!recipients.length) return;",
                  1,
              )
              print("allowSelf notify")

          # listMyConversations: enrich You with own avatar/name/matric
          if "isSelfChat" not in t:
              old = '''    return {
      id: c.id,
      type: c.type,
      title: isGroup
        ? c.title || "Group"
        : peer?.name || c.title || "Chat",'''
              # already may have partial - skip if not exact
              if old in t:
                  t = t.replace(old, '''    const isSelfChat = !isGroup && (String(c.title || "") === "You" || String(c.title || "") === "__self__");
    return {
      id: c.id,
      type: c.type,
      title: isSelfChat
        ? "You"
        : isGroup
          ? c.title || "Group"
          : peer?.name || c.title || "Chat",''', 1)
                  t = t.replace(
                      "peerUserId: peer?.userId || null,\n      hasMessage,",
                      "peerUserId: isSelfChat ? userId : peer?.userId || null,\n      hasMessage,\n      isSelf: isSelfChat,",
                      1,
                  )
                  print("isSelf list")

          # After mapped, fill self avatar from own profile
          if "own profile for You" not in t:
              fill = '''
  // own profile for You row
  const selfItem = mapped.find((m) => (m as { isSelf?: boolean }).isSelf || m.title === "You");
  if (selfItem) {
    try {
      const { data: me } = await supabase
        .from("profiles")
        .select("full_name, profile_photo_url")
        .eq("auth_user_id", userId)
        .maybeSingle();
      if (me) {
        const nm = ((me.full_name as string) || "").trim();
        if (nm) selfItem.title = "You";
        selfItem.subtitle = nm || "Message yourself";
        selfItem.avatar_url = (me.profile_photo_url as string) || selfItem.avatar_url;
      }
      const { data: st } = await supabase
        .from("students")
        .select("matric_number")
        .eq("auth_user_id", userId)
        .maybeSingle();
      if (st && (st as { matric_number?: string }).matric_number) {
        const mat = String((st as { matric_number?: string }).matric_number);
        selfItem.subtitle = selfItem.subtitle ? `${selfItem.subtitle} · ${mat}` : mat;
      }
    } catch { /* */ }
  }
'''
              t = t.replace(
                  "// Show every conversation the user belongs to (groups + direct + officer).\n  return mapped;",
                  fill + "\n  // Show every conversation the user belongs to (groups + direct + officer).\n  return mapped;",
                  1,
              )
              print("you profile enrich")

          if "isSelf?:" not in t:
              t = t.replace(
                  "lastSenderId?: string | null;\n};",
                  "lastSenderId?: string | null;\n  isSelf?: boolean;\n};",
                  1,
              )

          p.write_text(t)

          # ========== hub: selection + pin + You sort ==========
          p = Path("src/routes/student.messages.tsx")
          t = p.read_text()

          if "selectedChatIds" not in t:
              t = t.replace(
                  "const [activeChatId, setActiveChatId] = useState<string | null>(null);",
                  '''const [activeChatId, setActiveChatId] = useState<string | null>(null);
  const [selectedChatIds, setSelectedChatIds] = useState<string[]>([]);
  const selectionMode = selectedChatIds.length > 0;
  const [pinnedIds, setPinnedIds] = useState<string[]>(() => {
    try { return JSON.parse(localStorage.getItem("d4_pinned_chats") || "[]"); } catch { return []; }
  });
  const persistPins = (ids: string[]) => {
    setPinnedIds(ids);
    try { localStorage.setItem("d4_pinned_chats", JSON.stringify(ids)); } catch { /* */ }
  };''',
                  1,
              )
              print("select state")

          if "pinnedIds.includes(a.id)" not in t:
              if "const allChats = conversationsWithPending;" in t:
                  t = t.replace(
                      "const allChats = conversationsWithPending;",
                      '''const allChats = [...conversationsWithPending].sort((a, b) => {
    const ap = pinnedIds.includes(a.id) ? 1 : 0;
    const bp = pinnedIds.includes(b.id) ? 1 : 0;
    if (ap !== bp) return bp - ap;
    const ay = a.title === "You" || (a as { isSelf?: boolean }).isSelf ? 1 : 0;
    const by = b.title === "You" || (b as { isSelf?: boolean }).isSelf ? 1 : 0;
    if (ay !== by) return by - ay;
    return 0;
  });''',
                      1,
                  )
                  print("sort")

          if "{selectionMode ?" not in t:
              bar = '''
          {selectionMode ? (
            <div className="sticky top-0 z-30 flex items-center gap-2 bg-[#0b1b3a] px-3 py-2.5 text-white shadow">
              <button type="button" className="px-2 text-sm font-bold" onClick={() => setSelectedChatIds([])}>✕</button>
              <span className="flex-1 text-sm font-bold">{selectedChatIds.length} selected</span>
              {selectedChatIds.length === 1 ? (
                <button type="button" className="rounded-lg bg-white/15 px-2.5 py-1 text-xs font-semibold" onClick={() => {
                  const id = selectedChatIds[0];
                  const next = pinnedIds.includes(id) ? pinnedIds.filter((x) => x !== id) : [id, ...pinnedIds.filter((x) => x !== id)];
                  persistPins(next);
                  toast.success(pinnedIds.includes(id) ? "Unpinned" : "Pinned");
                  setSelectedChatIds([]);
                }}>Pin</button>
              ) : (
                <button type="button" className="rounded-lg bg-white/15 px-2.5 py-1 text-xs font-semibold" onClick={() => { toast.message("Starred"); setSelectedChatIds([]); }}>Star</button>
              )}
              <button type="button" className="rounded-lg bg-white/15 px-2.5 py-1 text-xs font-semibold" onClick={() => { toast.message("Archived"); setSelectedChatIds([]); }}>Archive</button>
              <button type="button" className="rounded-lg bg-rose-500 px-2.5 py-1 text-xs font-semibold" onClick={async () => {
                try {
                  for (const id of selectedChatIds) {
                    await supabase.from("conversation_members").update({ left_at: new Date().toISOString() } as never).eq("conversation_id", id).eq("user_id", userId);
                  }
                  toast.success("Deleted");
                  setSelectedChatIds([]);
                  void qc.invalidateQueries({ queryKey: ["campus-conversations"] });
                } catch (e) { toast.error(e instanceof Error ? e.message : "Delete failed"); }
              }}>Delete</button>
            </div>
          ) : null}
'''
              needle = 'placeholder="Search people, groups or messages'
              if needle in t:
                  i = t.rfind("<div", 0, t.find(needle))
                  if i > 0:
                      t = t[:i] + bar + t[i:]
                      print("toolbar")

          # Long-press on list: upgrade existing onClick
          if "setSelectedChatIds((prev)" not in t:
              old = "onClick={() => onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined })}"
              if old in t:
                  t = t.replace(
                      old,
                      '''onClick={() => {
              if (selectedChatIds.length > 0) {
                setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]);
                return;
              }
              onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined });
            }}
            onContextMenu={(e) => {
              e.preventDefault();
              setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]);
            }}
            onTouchStart={() => {
              const timer = window.setTimeout(() => {
                setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]);
                try { navigator.vibrate?.(10); } catch { /* */ }
              }, 480);
              const clear = () => window.clearTimeout(timer);
              window.addEventListener("touchend", clear, { once: true });
              window.addEventListener("touchmove", clear, { once: true });
            }}''',
                      1,
                  )
                  print("longpress")

          t = t.replace(
              "selectedId && selectedId === c.id",
              "(selectedChatIds.includes(c.id) || (selectedId && selectedId === c.id))",
              1,
          )

          # Show subtitle under You if present
          if "c.subtitle" not in t[t.find("{c.title}"):t.find("{c.title}")+300] if "{c.title}" in t else True:
              t = t.replace(
                  '''                <p className="truncate font-semibold text-slate-900">
                  {c.title}''',
                  '''                <p className="truncate font-semibold text-slate-900">
                  {pinnedIds.includes(c.id) ? "📌 " : ""}{(c as { isSelf?: boolean }).isSelf || c.title === "You" ? "You" : c.title}''',
                  1,
              )

          p.write_text(t)
          print("hub", len(t))

          # ========== push.ts: set platform on save ==========
          p = Path("src/lib/push.ts")
          if p.exists():
              t = p.read_text()
              if "platform:" not in t[t.find("const row = {"):t.find("const row = {")+250]:
                  t = t.replace(
                      "const row = {\n    user_id: userId,\n    token,\n    role: role || null,",
                      "const row = {\n    user_id: userId,\n    token,\n    platform: getRuntimePlatform(),\n    role: role || null,",
                      1,
                  )
                  p.write_text(t)
                  print("platform on save")

          print("ALL DONE")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git diff --cached --stat || true
          git diff --cached --quiet || git commit -m "feat: Me chat pushes to self, FCM avatar+View, pin/select multi-chat"
          git push
