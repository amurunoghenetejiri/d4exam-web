name: apply-msg-ux-v4
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Slim voice UI
        run: |
          python3 << 'EOF'
          from pathlib import Path
          p = Path("src/components/messaging/MessageMedia.tsx")
          t = p.read_text()
          reps = [
            ("h-7 w-full items-center gap-[1.5px]", "h-5 w-full items-center gap-[1.5px]"),
            ("h-3.5 w-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full shadow-md ring-2 ring-white", "h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full shadow ring-2 ring-white"),
            ("const heights = [6, 10, 14, 18, 12, 8, 16, 20, 14, 9, 13, 19, 11, 7, 15, 17, 12, 8, 14, 18, 10, 6, 12, 16, 11, 8, 13, 9];", "const heights = [4, 7, 10, 13, 9, 6, 12, 14, 10, 7, 9, 13, 8, 5, 11, 12, 9, 6, 10, 13, 7, 4, 9, 12, 8, 6, 10, 7];"),
            ("items-center gap-2 rounded-2xl px-2.5 py-2 shadow-sm", "items-center gap-3 rounded-2xl px-2.5 py-1.5 shadow-sm"),
            ("grid h-9 w-9 shrink-0 place-items-center rounded-full shadow-sm", "grid h-7 w-7 shrink-0 place-items-center rounded-full shadow-sm"),
            ('Pause className="h-3.5 w-3.5"', 'Pause className="h-3 w-3"'),
            ('Play className="ml-0.5 h-3.5 w-3.5"', 'Play className="ml-0.5 h-3 w-3"'),
            ("const timeShown = playing ? fmtDur(cur) : fmtDur(dur > 0 ? dur : 0);", 'const timeShown = dur > 0 ? (playing ? fmtDur(cur) + " / " + fmtDur(dur) : fmtDur(dur)) : (playing ? fmtDur(cur) : "...");'),
          ]
          for a, b in reps:
            print(t.count(a), a[:40])
            t = t.replace(a, b)
          p.write_text(t)
          print("mm", p.stat().st_size)
          EOF
      - name: Optimistic + scroll student
        run: |
          python3 << 'EOF'
          from pathlib import Path
          NL = chr(10)
          p = Path("src/routes/student.contact-officer.tsx")
          if not p.exists():
            print("skip"); raise SystemExit(0)
          t = p.read_text()
          if "optimisticMsgs" not in t:
            t = t.replace(
              "const [highlightKey, setHighlightKey] = useState<string | null>(null);",
              "const [highlightKey, setHighlightKey] = useState<string | null>(null);" + NL +
              "  const [optimisticMsgs, setOptimisticMsgs] = useState<ChatMsg[]>([]);" + NL +
              "  const [nearBottom, setNearBottom] = useState(true);" + NL +
              "  const [newBelow, setNewBelow] = useState(0);" + NL +
              "  const chatScrollRef = useRef<HTMLDivElement>(null);",
            )
            print("state")
          old = "return out.filter((m) => !hiddenKeys.has(m.key));" + NL + "  }, [rows, hiddenKeys]);"
          new = ("const base = out.filter((m) => !hiddenKeys.has(m.key));" + NL +
            "    const serverKeys = new Set(base.map((m) => m.key));" + NL +
            "    const pending = optimisticMsgs.filter((m) => !serverKeys.has(m.key) && !hiddenKeys.has(m.key));" + NL +
            "    return [...base, ...pending].sort((a, b) => new Date(a.at).getTime() - new Date(b.at).getTime());" + NL +
            "  }, [rows, hiddenKeys, optimisticMsgs]);")
          if old in t:
            t = t.replace(old, new); print("merge")
          marker = ("if (sendLock.current) return;" + NL + "      if (!schoolId) return;" + NL +
            "      if (!text.trim() && !attach) return;" + NL + "      sendLock.current = true;" + NL +
            "      setSending(true);" + NL + "      try {")
          if marker in t and "clientId" not in t:
            opt = marker.replace(
              "sendLock.current = true;" + NL + "      setSending(true);" + NL + "      try {",
              ("const clientId = `opt-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;" + NL +
               "      const nowIso = new Date().toISOString();" + NL +
               "      const optMsg: ChatMsg = { key: `${clientId}-s`, side: \"out\", text: text.trim() || (attach ? \"(attachment)\" : \"\"), at: nowIso, subject: replyTo ? `Re: ${(replyTo.text || \"\").slice(0, 40)}` : subject.trim() || null, attachment_url: attach?.url || null, attachment_type: attach?.type || null, reportId: clientId, replyPreview: replyTo?.text || null, replyToKey: replyTo ? `${replyTo.id}-s` : null };" + NL +
               "      setOptimisticMsgs((prev) => [...prev, optMsg]);" + NL +
               "      setReplyText(\"\"); setPendingAttach(null); setReplyTo(null); setComposeOpen(false); setInChat(true);" + NL +
               "      requestAnimationFrame(() => chatEndRef.current?.scrollIntoView({ behavior: \"smooth\" }));" + NL +
               "      sendLock.current = true;" + NL + "      setSending(true);" + NL + "      try {")
            )
            t = t.replace(marker, opt); print("opt")
          if "m.reportId !== clientId" not in t:
            t = t.replace(
              'await qc.invalidateQueries({ queryKey: ["student-my-reports"] });',
              'await qc.invalidateQueries({ queryKey: ["student-my-reports"] }); setOptimisticMsgs((prev) => prev.filter((m) => m.reportId !== clientId));',
            )
            print("clear")
          oldc = 'className="relative z-10 min-h-0 flex-1 space-y-4 overflow-y-auto px-3 py-3"'
          if oldc in t and "chatScrollRef" in t:
            t = t.replace(oldc, 'ref={chatScrollRef} onScroll={() => { const el = chatScrollRef.current; if (!el) return; const dist = el.scrollHeight - el.scrollTop - el.clientHeight; const near = dist < 140; setNearBottom(near); if (near) setNewBelow(0); }} className="relative z-10 min-h-0 flex-1 space-y-4 overflow-y-auto px-3 py-3"')
            print("scroll")
          oldfx = 'if (inChat) chatEndRef.current?.scrollIntoView({ behavior: "smooth" });'
          if oldfx in t and "nearBottom" in t:
            t = t.replace(oldfx, 'if (!inChat) return; if (nearBottom) { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); setNewBelow(0); } else { setNewBelow((n) => n + 1); }')
            print("fx")
          if "newBelow" in t and "Scroll to latest" not in t:
            btn = '{!nearBottom ? (<button type="button" aria-label="Scroll to latest" onClick={() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); setNearBottom(true); setNewBelow(0); }} className="absolute bottom-[4.5rem] right-4 z-30 flex items-center gap-1.5 rounded-full bg-[#0b1b3a] px-3 py-2 text-xs font-bold text-white shadow-lg ring-2 ring-white/20"><span className="text-sm leading-none">v</span>{newBelow > 0 ? <span>{newBelow} new</span> : null}</button>) : null}' + NL
            anchor = '<div className="relative z-10 shrink-0 border-t border-white/10 bg-[#0b1b3a] px-2 py-2'
            if anchor in t:
              t = t.replace(anchor, btn + anchor, 1); print("btn")
          t = t.replace(
            'const outTick = tick === "read" ? "read" : tick === "none" ? "none" : "delivered";',
            'const outTick: "none" | "sent" | "delivered" | "read" | "pending" = (m.reportId.startsWith("opt-") || m.key.startsWith("opt-")) ? "pending" : tick === "read" ? "read" : tick === "none" ? "none" : "delivered";',
          )
          print("tick")
          p.write_text(t)
          print("st", p.stat().st_size)
          EOF
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          git commit -m "feat: slim voice UI, optimistic send, scroll-to-latest, pending clock" || echo nochange
          git push origin main
