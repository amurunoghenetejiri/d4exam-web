name: push-d4ai-voice-final
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write full student.d4ai.tsx
        run: |
          python3 << 'EOF'
          import base64, gzip, pathlib
          b64 = """"""
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("src/routes").mkdir(parents=True, exist_ok=True)
          pathlib.Path("src/routes/student.d4ai.tsx").write_bytes(data)
          print("wrote", len(data), "bytes")
          EOF
          wc -c src/routes/student.d4ai.tsx
          head -c 200 src/routes/student.d4ai.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.d4ai.tsx
          git status
          git commit -m "fix(d4ai): full voice call, TTS, Link attach popup, STT dedupe, no bottom nav, light mode" || echo "nochange"
          git push
