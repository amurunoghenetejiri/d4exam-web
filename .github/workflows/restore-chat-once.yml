name: restore-chat-file
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-chat-once.yml"
      - "scripts/patch_chat_restore.py"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch and restore conversation chat
        run: python3 scripts/patch_chat_restore.py
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add 'src/routes/student.messages.$conversationId.tsx'
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix: restore chat; media/voice show then tick when uploaded"
          git push
