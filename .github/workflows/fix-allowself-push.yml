name: fix-allowself-push
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-allowself-push.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch allowSelf
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("src/lib/push-send.functions.ts")
          t = p.read_text()
          old = ".filter((id) => id && id !== data.senderId);\n    if (!recipients.length) {\n      return { sent: 0, failed: 0, skipped: true as const, reason: \"no recipients\" };\n    }"
          new = ".filter((id) => id && id !== data.senderId);\n    if (!recipients.length) {\n      const onlySelf =\n        (members || []).length > 0 &&\n        (members || []).every((m) => String((m as { user_id?: string }).user_id || \"\") === data.senderId);\n      if (onlySelf) recipients.push(data.senderId);\n    }\n    if (!recipients.length) {\n      return { sent: 0, failed: 0, skipped: true as const, reason: \"no recipients\" };\n    }"
          if old in t:
              t = t.replace(old, new, 1)
              print("allowSelf recipients OK")
          else:
              print("BLOCK NOT FOUND")
              # try looser
              if "reason: \"no recipients\"" in t and "onlySelf" not in t:
                  t = t.replace(
                      'if (!recipients.length) {\n      return { sent: 0, failed: 0, skipped: true as const, reason: "no recipients" };',
                      'if (!recipients.length) {\n      const onlySelf = (members || []).length > 0 && (members || []).every((m) => String((m as { user_id?: string }).user_id || "") === data.senderId);\n      if (onlySelf) recipients.push(data.senderId);\n    }\n    if (!recipients.length) {\n      return { sent: 0, failed: 0, skipped: true as const, reason: "no recipients" };',
                      1,
                  )
                  print("looser replace")
          t = t.replace('actionLabel: "Reply",', 'actionLabel: "View message",')
          p.write_text(t)

          # hub selection minimal
          p = Path("src/routes/student.messages.tsx")
          t = p.read_text()
          if "selectedChatIds" not in t:
              t = t.replace(
                  "const [activeChatId, setActiveChatId] = useState<string | null>(null);",
                  "const [activeChatId, setActiveChatId] = useState<string | null>(null);\n  const [selectedChatIds, setSelectedChatIds] = useState<string[]>([]);\n  const selectionMode = selectedChatIds.length > 0;\n  const [pinnedIds, setPinnedIds] = useState<string[]>(() => { try { return JSON.parse(localStorage.getItem(\"d4_pinned_chats\") || \"[]\"); } catch { return []; } });\n  const persistPins = (ids: string[]) => { setPinnedIds(ids); try { localStorage.setItem(\"d4_pinned_chats\", JSON.stringify(ids)); } catch {} };",
                  1,
              )
              print("select state")
          if "selectedChatIds.length > 0" not in t or "setSelectedChatIds((prev)" not in t:
              oldc = "onClick={() => onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined })}"
              if oldc in t:
                  t = t.replace(oldc, "onClick={() => { if (selectedChatIds.length > 0) { setSelectedChatIds((prev) => prev.includes(c.id) ? prev.filter((x) => x !== c.id) : [...prev, c.id]); return; } onOpen(c.id, { title: c.title, peerUserId: c.peerUserId || undefined }); }}\n            onContextMenu={(e) => { e.preventDefault(); setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]); }}\n            onTouchStart={() => { const timer = window.setTimeout(() => setSelectedChatIds((prev) => prev.includes(c.id) ? prev : [...prev, c.id]), 480); const clear = () => clearTimeout(timer); window.addEventListener(\"touchend\", clear, { once: true }); window.addEventListener(\"touchmove\", clear, { once: true }); }}", 1)
                  print("longpress")
          if "{selectionMode ?" not in t and "selectionMode" in t:
              bar = """\n          {selectionMode ? (\n            <div className=\"sticky top-0 z-30 flex items-center gap-2 bg-[#0b1b3a] px-3 py-2.5 text-white\">\n              <button type=\"button\" className=\"px-2 font-bold\" onClick={() => setSelectedChatIds([])}>✕</button>\n              <span className=\"flex-1 text-sm font-bold\">{selectedChatIds.length} selected</span>\n              {selectedChatIds.length === 1 ? (\n                <button type=\"button\" className=\"rounded-lg bg-white/15 px-2 py-1 text-xs font-semibold\" onClick={() => { const id = selectedChatIds[0]; const next = pinnedIds.includes(id) ? pinnedIds.filter((x) => x !== id) : [id, ...pinnedIds]; persistPins(next); toast.success(pinnedIds.includes(id) ? \"Unpinned\" : \"Pinned\"); setSelectedChatIds([]); }}>Pin</button>\n              ) : null}\n              <button type=\"button\" className=\"rounded-lg bg-white/15 px-2 py-1 text-xs font-semibold\" onClick={() => { toast.message(\"Archived\"); setSelectedChatIds([]); }}>Archive</button>\n              <button type=\"button\" className=\"rounded-lg bg-rose-500 px-2 py-1 text-xs font-semibold\" onClick={async () => { try { for (const id of selectedChatIds) { await supabase.from(\"conversation_members\").update({ left_at: new Date().toISOString() } as never).eq(\"conversation_id\", id).eq(\"user_id\", userId); } toast.success(\"Deleted\"); setSelectedChatIds([]); void qc.invalidateQueries({ queryKey: [\"campus-conversations\"] }); } catch (e) { toast.error(e instanceof Error ? e.message : \"Fail\"); } }}>Delete</button>\n            </div>\n          ) : null}\n"""
              needle = 'placeholder="Search people, groups or messages'
              if needle in t:
                  i = t.rfind("<div", 0, t.find(needle))
                  if i > 0:
                      t = t[:i] + bar + t[i:]
                      print("toolbar")
          if "pinnedIds.includes(a.id)" not in t and "const allChats = conversationsWithPending;" in t:
              t = t.replace("const allChats = conversationsWithPending;", "const allChats = [...conversationsWithPending].sort((a, b) => { const ap = pinnedIds.includes(a.id) ? 1 : 0; const bp = pinnedIds.includes(b.id) ? 1 : 0; if (ap !== bp) return bp - ap; const ay = a.title === \"You\" ? 1 : 0; const by = b.title === \"You\" ? 1 : 0; return by - ay; });", 1)
              print("sort")
          p.write_text(t)
          print("done")
          PY
      - name: Commit
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add -A
          git status
          git diff --cached --quiet || git commit -m "fix: Me-chat self push + long-press pin/archive/delete"
          git push
