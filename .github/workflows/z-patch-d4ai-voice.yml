name: Patch D4AI Voice Composer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -euo pipefail
          cat > /tmp/p.b64 << 'B64'
          
          B64
          python3 -c "import base64,gzip; open('/tmp/patch_d4ai_voice.py','wb').write(gzip.decompress(base64.b64decode(open('/tmp/p.b64').read())))"
          python3 /tmp/patch_d4ai_voice.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/student.d4ai.tsx
          git status
          git commit -m "fix(d4ai): attach sheet, live call TTS voices, STT dedupe, remove bottom nav" || echo nochange
          git push
