name: fix-msg-import
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken imports and place retry UI correctly
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re

          p = Path("src/routes/student.contact-officer.tsx")
          if not p.exists():
              print("no student file"); raise SystemExit(0)
          t = p.read_text()

          t = t.replace("X,, Clock}", "X, Clock}")
          t = t.replace("X, , Clock}", "X, Clock}")

          if "{(uploadPct" in t and "from \"@/components/messaging/MessageMedia\"" in t:
              t = re.sub(
                  r'import \{ VoiceBubble.*?from "@/components/messaging/MessageMedia";',
                  'import { VoiceBubble, ImageBubble, ImageLightbox, VideoBubble, FileBubble, VideoLightbox, LongPressMenu, VoiceRecorderBar, lastSeenLabel, parseMediaUrls, attachmentLabel, parseOfficerReply } from "@/components/messaging/MessageMedia";',
                  t,
                  count=1,
                  flags=re.DOTALL,
              )
              print("fixed import")

          if "failedIds.size > 0" not in t and "failedIds" in t:
              inject = '''{(uploadPct != null && uploadPct < 100) ? (
        <div className="mx-3 mb-1 h-1 overflow-hidden rounded-full bg-slate-200">
          <div className="h-full bg-[#1e3a5f] transition-all" style={{ width: `${uploadPct}%` }} />
        </div>
      ) : null}
      {failedIds.size > 0 ? (
        <div className="mx-3 mb-1 flex items-center justify-between rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-1.5 text-[11px] text-amber-900">
          <span>{failedIds.size} message{failedIds.size > 1 ? "s" : ""} waiting to send</span>
          <button type="button" className="rounded-md bg-[#1e3a5f] px-2 py-0.5 font-semibold text-white" onClick={() => { notifyOutbox(); window.dispatchEvent(new Event("online")); }}>Retry</button>
        </div>
      ) : null}
'''
              if "<VoiceRecorderBar" in t:
                  t = t.replace("<VoiceRecorderBar", inject + "<VoiceRecorderBar", 1)
                  print("retry ui")

          p.write_text(t)
          print("done", p.stat().st_size)
          EOF
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          git commit -m "fix: restore MessageMedia import and place retry UI in JSX" || echo nochange
          git push origin main
